name: Terrafom Plan
on: pull_request

env:
  TG_NON_INTERACTIVE: "true"
  TG_NO_COLOR: "true"
  TG_ALL: "true"

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup terraform
        uses: hashicorp/setup-terraform@v3
      - name: Initialize
        working-directory: tests/fixtures/basic/7-create-hundreds
        run: |
          terraform init
          terraform plan -out ${{ github.workspace }}/.planfile
      - name: Post PR comment
        uses: aldwyn/terraform-plan-comment@e8659b9950e558ee4fbb8b5360eabe8d4d116a6a
        with:
          token: ${{ github.token }}
          planfile: ${{ github.workspace }}.planfile
